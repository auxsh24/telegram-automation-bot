# Telegram Relay Dashboard — local setup.
#
#   docker compose up -d --build
#   open http://localhost:8000
#
# No .env file is needed. Telegram API credentials, login, channels and the
# converter bot are all entered in the browser and saved in ./data.
#
# The port is bound to loopback on purpose: the dashboard has no password, so
# only this machine can open it. Do not change 127.0.0.1 to 0.0.0.0.
#
# Keep --build in the command. The image tag is pinned, so without it Docker
# can silently reuse an old image.

services:
  telegram-relay:
    build: .
    image: telegram-relay:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      # Optional pre-configuration; every one of these can also be set in the UI.
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - RELAY_CONVERTER_BOT=${RELAY_CONVERTER_BOT:-@ExtraPeBot}
      - RELAY_SOURCE_CHANNELS=${RELAY_SOURCE_CHANNELS:-[]}
      - RELAY_DUPLICATE_TTL_DAYS=${RELAY_DUPLICATE_TTL_DAYS:-1}
      - RELAY_RETRY_ATTEMPTS=${RELAY_RETRY_ATTEMPTS:-3}
      - RELAY_RETRY_DELAY_SECONDS=${RELAY_RETRY_DELAY_SECONDS:-2}
      - RELAY_LOG_RETENTION_DAYS=${RELAY_LOG_RETENTION_DAYS:-1}
      - RELAY_TRUSTED_PROXIES=${RELAY_TRUSTED_PROXIES:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
